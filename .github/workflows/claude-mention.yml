name: Claude (@mention)

# Write "@claude ..." in an issue or PR comment and Claude works that item.
# Complements the opt-in label flow (claude-labeled.yml). Draft PRs only,
# never master. Requires the CLAUDE_CODE_OAUTH_TOKEN secret.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Only the owner / collaborators can trigger this. Comment events carry
    # secrets even from strangers, so gate the @claude path on author role.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    concurrency:
      group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Pick model
        id: model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="${{ github.event.issue.number || github.event.pull_request.number }}"
          bash .github/scripts/pick-model.sh "$n" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model ${{ steps.model.outputs.model }} --max-turns 60 --dangerously-skip-permissions"
