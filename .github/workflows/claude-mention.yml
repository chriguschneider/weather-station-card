name: Claude (@mention)

# Event-driven: someone writes "@claude ..." in an issue or PR comment, or an
# issue is assigned. The model is chosen from the issue's labels. Requires
# the CLAUDE_CODE_OAUTH_TOKEN secret; without it the job skips with a
# notice. See docs/agent-automation.md.

# zizmor: comment triggers run with secrets for any commenter. That is the
# point of @claude; the job-level author_association gate below limits it to
# people with write access, and the action checks write access again.
on:
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [assigned]

permissions: {}

jobs:
  claude:
    # Only the owner / collaborators can trigger this: comment events carry
    # secrets even from strangers. An assignment works the issue text, so
    # the issue itself must come from someone with write access too.
    if: >-
      (github.event_name == 'issues' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name != 'issues' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # claude-code-action needs OIDC for its GitHub App token
    concurrency:
      group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      # Outbound traffic: `audit` logs every connection, `block` allows only
      # the list. Start with audit, switch to block once a few runs show the
      # full list (docs/agent-automation.md). Must stay the first step.
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.anthropic.com:443
            claude.ai:443
            downloads.claude.ai:443
            storage.googleapis.com:443
            bun.sh:443
            registry.npmjs.org:443
            github.com:443
            api.github.com:443
            uploads.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Check the Claude token is configured
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping (see docs/agent-automation.md)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          # See claude-labeled.yml: persisted credentials would make agent
          # pushes go out as github-actions[bot].
          persist-credentials: false


      # The agent runs the repo's checks itself.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version: "22"
      - name: Pick model from issue labels
        id: model
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/pick-model.sh "$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Claude
        id: claude
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        if: steps.token.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          include_comments_by_actor: "${{ github.repository_owner }},claude[bot]"
          settings: .claude/ci-settings.json
          # The action reads the @claude comment as the task. 60 turns, not
          # 20: a mention that asks for a real change hits 20 while still
          # gathering context.
          claude_args: >-
            --model ${{ steps.model.outputs.model }}
            --max-turns 60
            --permission-mode dontAsk
            --allowedTools "Read,Glob,Grep,Edit,Write,TodoWrite,Bash(git status*),Bash(git diff*),Bash(git log*),Bash(git show*),Bash(git switch*),Bash(git checkout*),Bash(git branch*),Bash(git add*),Bash(git commit*),Bash(git push*),Bash(git rm*),Bash(git mv*),Bash(git restore*),Bash(git fetch*),Bash(git rev-parse*),Bash(ls*),Bash(cd *),Bash(gh issue view*),Bash(gh issue comment*),Bash(gh pr create*),Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr checks*),Bash(gh pr comment*),Bash(gh pr edit*),Bash(gh pr list*),Bash(npm ci*),Bash(npm install*),Bash(npm run lint*),Bash(npm run typecheck*),Bash(npm run depcheck*),Bash(npm run coverage*),Bash(npm run rollup*),Bash(npm run build*),Bash(npm test*),Bash(npx vitest*),Bash(npm audit*),Bash(grep*),Bash(rg*),Bash(find*),Bash(head*),Bash(tail*),Bash(wc*),Bash(cat*),Bash(sed*),Bash(awk*),Bash(sort*),Bash(uniq*),Bash(diff*),Bash(jq*),Bash(mkdir*),Bash(cp*),Bash(mv*),Bash(touch*),Bash(echo*),Bash(printf*),Bash(node *),Bash(npx tsc*),Bash(npx eslint*),Bash(npm run *),Bash(git merge*),Bash(git pull*),Bash(gh pr ready*),Bash(/home/runner/work/_actions/anthropics/claude-code-action/*)"
            --append-system-prompt "Unattended run with a Bash allowlist: every command of a chain is checked on its own; command substitution ($(...), backticks), heredocs and shell loops never match and are refused. Commit with git commit -F <file> (write the message with the Write tool first), PR/comment texts via --body-file, bulk edits via one script or the Edit tool. A refused call is never a reason to stop: use the allowed equivalent."

      # The mention flow has no leftover handling; at least make a refused
      # call visible in the log and the job summary instead of only in the
      # agent's own words.
      - name: Report refused tool calls
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          [ -f "$EXEC_FILE" ] || exit 0
          d="$(jq -r '[.[] | select(.type == "result")] | last | .permission_denials // [] | .[] | "- `\(.tool_name)`: `\(.tool_input.command // .tool_input.file_path // "" | tostring | .[0:300])`"' "$EXEC_FILE" 2>/dev/null || true)"
          [ -z "$d" ] && exit 0
          printf 'tool calls refused by the allowlist:\n%s\n' "$d"
          { echo "### Tool calls refused by the allowlist"; echo; echo "$d"; } >> "$GITHUB_STEP_SUMMARY"
