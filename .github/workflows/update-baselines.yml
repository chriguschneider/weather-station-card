name: Update E2E Baselines

# Manually-triggered workflow that regenerates the Playwright visual
# regression baselines on the actual GHA Linux runner and commits the
# result back to the branch the workflow ran on. Use it whenever a
# deliberate UI change has shifted what the card renders — saves the
# round-trip of generating baselines locally (in WSL) and discovering
# they still diff because of subpixel-rendering differences between
# WSL2's GPU virtualization and the GHA container.
#
# Trigger:
#   - GitHub UI: Actions → Update E2E Baselines → Run workflow → pick branch
#   - CLI: `gh workflow run update-baselines.yml --ref <branch>`
#
# After the run, the actor's branch has a fresh
# "chore: update e2e baselines from CI" commit on top with the
# regenerated PNGs under tests-e2e/snapshots/. Pull, review the diff,
# and merge as part of the PR / release.

on:
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      # Required so GITHUB_TOKEN can push the bot commit back to the
      # branch — repo default since the 2022 permissions tightening
      # is contents:read.
      contents: write
    steps:
      - name: Checkout
        # Unlike every other checkout here, credentials stay persisted: the
        # last step pushes the regenerated baselines back with them. Manual
        # dispatch only, by someone with write access; no artifact is
        # uploaded, so the token cannot leak through one.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the full ref so the bot's push goes to the same
          # branch the workflow was dispatched on.
          ref: ${{ github.ref }}
          # Kept on purpose (the default): leaves GITHUB_TOKEN in the
          # git config so the final `git pull --rebase` / `git push` use it.
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # These PNGs become the visual contract; build from a clean
          # install, not from a cache an earlier run could have filled.
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build bundle
        # Visual baselines load the bundle from /dist; build it fresh
        # so the regenerated baselines reflect the source HEAD, not
        # whatever bundle was committed last.
        run: npm run rollup

      - name: Regenerate baselines
        # Delete the existing baselines first. Playwright's
        # --update-snapshots only overwrites a PNG when the new
        # render differs MORE than the configured tolerance — with
        # the current loose 5 % threshold, WSL-generated baselines
        # already pass against GHA renders so no fresh PNG would be
        # written. Hard-deleting forces every test to write a new
        # baseline regardless.
        run: |
          rm -rf tests-e2e/snapshots
          npx playwright test --update-snapshots

      - name: Commit + push if changed
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add tests-e2e/snapshots
          if git diff --cached --quiet; then
            echo "No baseline changes - nothing to commit."
            exit 0
          fi
          git commit -m "chore: update e2e baselines from CI ($REF_NAME run $RUN_ID)"
          # The "Build bundle" and "Install dependencies" steps rebuild
          # dist/ and can re-touch package-lock.json, leaving tracked
          # working-tree modifications that are NOT part of the baseline
          # commit. `git pull --rebase` refuses to run with a dirty tree
          # ("cannot pull with rebase: You have unstaged changes"), so
          # discard everything except the just-committed snapshots first.
          # We intentionally do NOT commit the CI-rebuilt dist here — the
          # branch already carries the canonical bundle from the release
          # commit; this workflow only needs dist to render screenshots.
          git checkout -- .
          # Race-resistant push: the branch may have advanced while the
          # workflow was running (it ran for ~2 min, plenty of room).
          # Rebase onto remote first; the only changes we have are the
          # baseline PNGs which never conflict with code changes.
          git pull --rebase origin "$REF_NAME"
          git push
